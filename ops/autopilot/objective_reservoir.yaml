    family: VISUAL_PRODUCTION_MODE
    priority: 100
    expected_value: Establish a first visual constitution candidate before more automation meta work.
    risk_tier: low
    allowed_paths:
      - docs/design/**
      - docs/autopilot/**
      - ops/autopilot/**
    forbidden_paths:
      - backend/**
      - frontend/**
      - package.json
      - package-lock.json
      - ops/autopilot/local/**
      - ops/autopilot/runtime/**
    expected_artifacts:
      - manifest.json
      - visual_delta_report.md
      - mission_doctor_result.json
    success_criteria:
      - constitution_candidate_defined
      - learning_loop_contribution_explained
      - no_live_web_dependency
