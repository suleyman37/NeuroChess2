risk_tiers:
  docs_tooling:
    auto_promote: true
    checks_required:
      - git_diff_check
      - plan_guard_when_docs_rebuild_touched
    critic_required: false
    target: road-to-V2

  frontend_readonly:
    auto_promote: true
    checks_required:
      - git_diff_check
      - frontend_build
      - tsc
      - relevant_rex_smokes
    critic_required: true
    target: road-to-V2

  backend_readonly:
    auto_promote: true
    checks_required:
      - git_diff_check
      - targeted_backend_tests
      - anti_mutation_proof
    critic_required: true
    target: road-to-V2

  write_sensitive:
    auto_promote: false
    quarantine_branch_prefix: autopilot/
    checks_required:
      - full_sensitive
      - db_snapshot_before_after
      - route_audit
    critic_required: true

circuit_breaker:
  consecutive_task_failures: 3
  same_task_failures: 3
  action: mark_degraded_and_write_incident

forbidden_stage_paths:
  - .serena/project.yml
  - .venv/
  - qa_artifacts/
  - backend/neurochess/data/openings_book.json

github_runner:
  allow_self_hosted_on_public_repo: false
  primary_scheduler: windows_scheduled_task

distributed_workers:
  enabled: true
  primary_executor: main
  critic_worker: gpu_worker
  worker_config: ops/autopilot/workers.yaml
  remote_critics:
    text:
      prefer_remote_when_registered: true
      unavailable_verdict: critic_unavailable
      blocks_docs_tooling: false
      blocks_frontend_readonly: false
    vision:
      prefer_remote_when_registered: true
      unavailable_verdict: critic_unavailable
      blocks_docs_tooling: false
      blocks_frontend_readonly: false
  worker_guardrails:
    can_modify_repo: false
    can_commit: false
    can_push: false
    runs_scheduler: false
    no_github_self_hosted_runner: true
    ollama_network_scope: lan_only
  promotion_authority:
    road_to_v2_push_allowed_from: main
    gpu_worker_push_allowed: false
