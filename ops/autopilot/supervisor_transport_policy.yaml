schema_version: supervisor_transport_policy_v1
updated_by: A20BC_MCP_PLAYWRIGHT_SESSION_BOOTSTRAP_CHATGPT_AJ_E2E_REPAIR

strategy_supervisor:
  preferred_order:
    - mcp_playwright_chatgpt_supervisor
    - native_playwright_chatgpt_supervisor
    - legacy_cdp_chatgpt_supervisor
    - supervisor_browser_harness
    - chatgpt_windows_app_adapter
    - local_omega_fallback
  zero_cost_policy:
    openai_api_enabled: false
    gemini_api_enabled: false
    paid_platforms_enabled: false
  safety_rules:
    no_blind_typing: true
    no_credentials: true
    no_auth_bypass: true
    no_captcha_automation: true
    no_2fa_automation: true
    no_private_urls_in_logs: true
    park_blocked_lanes: true
    local_fallback_always_available: true

lanes:
  mcp_playwright_chatgpt_supervisor:
    enabled: true
    mode: codex_mcp_playwright_if_ready
    ready_statuses:
      - CHATGPT_A_READY
      - CHATGPT_A_MESSAGE_SUBMITTED_RESPONSE_UNREAD
    blocked_statuses:
      - CHATGPT_SESSION_BOOTSTRAP_NEEDS_MANUAL_AUTH
      - CHATGPT_AJ_POOL_MISSING
      - CHATGPT_COMPOSER_NOT_FOUND
      - PLAYWRIGHT_SUPERVISOR_UNAVAILABLE
      - MCP_PLAYWRIGHT_BOOTSTRAP_PARTIAL
      - MCP_PLAYWRIGHT_BOOTSTRAP_FAILED
  native_playwright_chatgpt_supervisor:
    enabled: true
    mode: native_playwright_fallback
    ready_statuses:
      - CHATGPT_A_READY
      - CHATGPT_A_MESSAGE_SUBMITTED_RESPONSE_UNREAD
    blocked_statuses:
      - CHATGPT_SESSION_BOOTSTRAP_NEEDS_MANUAL_AUTH
      - CHATGPT_AJ_POOL_MISSING
      - CHATGPT_COMPOSER_NOT_FOUND
      - PLAYWRIGHT_SUPERVISOR_UNAVAILABLE
  legacy_cdp_chatgpt_supervisor:
    enabled: true
    mode: legacy_cdp_only_if_available
  chatgpt_windows_app_adapter:
    enabled: true
    mode: local_ui_discovery_only
    ready_status: CHATGPT_DESKTOP_TRANSPORT_READY
    blocked_statuses:
      - CHATGPT_DESKTOP_NOT_INSTALLED
      - CHATGPT_DESKTOP_INSTALLED_NOT_AUTOMATABLE
      - CHATGPT_DESKTOP_AUTH_REQUIRED
      - CHATGPT_DESKTOP_COMPOSER_NOT_FOUND
      - CHATGPT_DESKTOP_SAFE_SEND_FAILED
      - CHATGPT_DESKTOP_ADAPTER_UNSAFE
  chatgpt_web_a_j_pool:
    enabled: true
    mode: optional_cdp
    park_if_cdp_unavailable: true
  supervisor_browser_harness:
    enabled: true
    mode: dedicated_profile_free_browser
    ready_statuses:
      - CHATGPT_WEB_SUPERVISOR_E2E_READY
      - CHATGPT_WEB_MESSAGE_SUBMITTED_RESPONSE_UNREAD
    blocked_statuses:
      - CHATGPT_WEB_HUMAN_ACTION_REQUIRED_PARKED
      - CHATGPT_AJ_POOL_MISSING
      - CHATGPT_COMPOSER_NOT_FOUND
      - SUPERVISOR_BROWSER_LAUNCH_FAILED
      - SUPERVISOR_BROWSER_HARNESS_PARTIAL
      - SUPERVISOR_BROWSER_HARNESS_FAILED
  local_omega_fallback:
    enabled: true
    mode: always_available
