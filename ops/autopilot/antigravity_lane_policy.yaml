schema_version: antigravity_lane_policy_v2
mission_id: A20BI

doctrine:
  summary: "LLMs propose; local system disposes."
  codex_only_integrator: true
  antigravity_sandbox_only: true
  gemini_visual_critic_only: true
  chatgpt_strategy_critic_only: true
  omega_local_arbiter: true
  local_fallback_authoritative: true
  human_taste_optional_not_required: true

roles:
  codex:
    name: "CODEX"
    title: "Production Integrator"
    allowed:
      - apply_validated_patches
      - run_tests
      - fix_build_typecheck_failures
      - commit_push_mission_branches
      - enforce_git_hygiene
      - reject_unsafe_proposals
    forbidden:
      - broad_exploratory_ui_generation_when_antigravity_is_better_suited
      - accepting_self_reported_risk_without_local_validation
    may_commit: true
    may_push_non_protected_branch: true
    may_push_road_to_v2: false

  antigravity:
    name: "ANTIGRAVITY"
    title: "Sandbox Explorer"
    allowed:
      - low_risk_dev_only_frontend_prototypes
      - visual_variant_exploration
      - svg_css_jsx_experiments
      - isolated_tests_for_created_components
      - screenshots_external_artifacts_only
      - proposal_packs_only
    forbidden:
      - direct_official_repo_modification
      - commits
      - pushes
      - backend_package_db_changes
      - secrets_local_runtime
      - v1_product_behavior
      - package_installs
      - road_to_v2
    output_only: patch_proposal_pack

  gemini:
    name: "GEMINI"
    title: "Visual Critic"
    allowed:
      - analyze_isolated_screenshots
      - reject_board_pollution
      - critique_ui_hierarchy_contrast_weirdness
      - suggest_next_visual_patch
    forbidden:
      - direct_code_integration
      - judging_contact_sheets_as_primary_evidence
      - claiming_visual_review_without_image_attachment

  chatgpt:
    name: "CHATGPT WEB"
    title: "Strategy Critic"
    allowed:
      - product_strategy
      - mission_challenge
      - contradiction_detection
      - risk_reasoning
      - architecture_review
    forbidden:
      - blocking_the_run
      - acting_as_final_authority_over_hard_safety_gates

  omega:
    name: "OMEGA"
    title: "Local Arbiter"
    allowed:
      - route_tasks
      - apply_scoring
      - enforce_gates
      - park_failed_lanes
      - trigger_fallback
      - update_failure_ledger_protocol_memory
    forbidden:
      - inflating_scores_without_proof
      - selecting_non_pixel_work_during_pixel_bottleneck

  human:
    name: "HUMAN / SULEYMAN"
    title: "Optional Taste Arbiter"
    allowed:
      - final_taste_vote
      - aesthetics_tie_breaker
      - emergency_intervention_by_ntfy
    forbidden:
      - becoming_required_for_autonomous_progress

worktree_policy:
  preferred_external_root: "C:/Users/suley/Documents/Dev/NeuroChess_Agent_Worktrees"
  create_from_exact_commit: true
  disposable: true
  forbid_road_to_v2: true
  forbid_origin_push: true
  forbid_secrets: true
  official_repo_direct_write_forbidden: true

proposal_pack:
  required_files:
    - proposal.json
    - patch.diff
    - summary.md
    - risk_report.json
    - test_report.json
    - files_touched.txt
    - integration_notes.md
  screenshots_external_only: true
  recommended_codex_actions:
    - ACCEPT
    - ACCEPT_WITH_FIXES
    - REJECT
    - RETRY_WITH_CONSTRAINTS

import_gate:
  max_files: 20
  max_diff_lines: 800
  safe_import_surface:
    - "frontend/src/dev/antigravity-spikes/**"
    - "scripts/browser_antigravity_*_smoke.mjs"
    - "docs/autopilot/A20ANTIGRAVITY*_REPORT.md"
  app_tsx_mount_owned_by_codex_only: true
  reject_missing_nonce: true
  reject_duplicate_nonce: true
  reject_base_commit_mismatch: true
  reject_backend_without_permission: true
  reject_package_files: true
  reject_db_files: true
  reject_local_runtime: true
  reject_images_and_screenshots: true
  reject_secrets_private_urls_cookies_tokens: true
  reject_v1_route_modification: true
  reject_frontend_dev_paths_outside_antigravity_spikes: true
  reject_invalid_git_patch_diff: true
  require_summary_risk_test_reports: true
  require_clear_objective: true
  require_rollback_path: true
  dry_run_validation_first: true
  atomic_temp_apply_only: true
  explicit_file_staging_only: true
  broad_staging_forbidden: true

routing_algorithm:
  formula: "2.0*agent_fit + 1.6*expected_pixel_value + 1.4*exploration_value + 1.2*proof_strength - 2.0*integration_risk - 1.8*safety_risk - 1.3*live_dependency_risk - 1.0*codex_context_cost - 0.8*recent_failure_penalty"
  hard_rules:
    - if_safety_risk_over_0_4_external_agents_cannot_execute
    - if_integration_risk_over_0_6_codex_primary
    - if_backend_package_db_touched_antigravity_forbidden
    - if_visual_exploratory_and_integration_risk_under_0_4_antigravity_preferred
    - if_image_critique_required_gemini_preferred
    - if_strategic_contradiction_chatgpt_preferred
    - if_live_lane_unavailable_local_fallback_wins
    - if_pixel_bottleneck_active_non_pixel_tasks_penalized

first_antigravity_work_order:
  selected_by: weighted_auction
  minimum_candidates: 12
  selected_task: critical_moment_sigil_visual_variant_spike
  allowed_paths:
    - "frontend/src/dev/antigravity-spikes/**"
    - "scripts/browser_antigravity_*_smoke.mjs"
    - "docs/autopilot/A20ANTIGRAVITY*_REPORT.md"
  forbidden_paths:
    - "backend/**"
    - "frontend/src/App.tsx"
    - "frontend/src/dev/** except frontend/src/dev/antigravity-spikes/**"
    - "package.json"
    - "package-lock.json"
    - "ops/autopilot/local/**"
    - "ops/autopilot/runtime/**"
    - ".serena/**"
  antigravity_may_run_next_spike: true

router:
  antigravity_when:
    - exploratory_visual_variants
    - dev_only_frontend_spikes
    - screenshots_matter
    - low_integration_risk
  codex_when:
    - final_integration
    - commit_or_push_required
    - protected_paths
    - governance_or_tests
  gemini_when:
    - screenshot_critique
    - board_readability
    - visual_weirdness
  chatgpt_when:
    - product_strategy
    - architecture_critique
    - contradiction_resolution
  local_fallback_when:
    - live_lanes_fail
    - external_agents_unavailable
    - offline_progress_required
